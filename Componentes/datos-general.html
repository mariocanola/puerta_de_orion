<form class="formulario-datos">
    <h3>Perfil</h3>

    <div class="fila-formulario">
        <input type="text" placeholder="Primer nombre">
        <input type="text" placeholder="Segundo nombre">
        <input type="text" placeholder="Primer apellido">
        <input type="text" placeholder="Segundo apellido">
    </div>

    <hr class="form-divider">

    <div class="fila-formulario">
        <input type="date" value="2025-12-03">
        <select>
            <option value="" disabled selected hidden>Género</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
        </select>
    </div>

    <hr class="form-divider">

    <div class="fila-formulario">
        <select>
            <option value="" disabled selected hidden>Tipo de documento</option>
            <option value="cc">Cédula de ciudadanía</option>
            <option value="ti">Tarjeta de identidad</option>
            <option value="ce">Cédula de extranjería</option>
            <option value="pasaporte">Pasaporte</option>
        </select>
        <input type="text" placeholder="Número de documento">
    </div>

    <hr class="form-divider">

    <div class="fila-formulario">
        <input type="text" placeholder="Correo electrónico">
        <input type="text" placeholder="Número telefónico">
    </div>

    <div class="fila-formulario" style="display: flex; justify-content: center;">
        <input type="text" style="width: 350px;" placeholder="Contraseña">
    </div>

    <hr class="form-divider">

    <div style="display: flex; justify-content: center;">
        <button class="boton-formulario" style="width: 250px">Actualizar</button>
    </div>
</form>
