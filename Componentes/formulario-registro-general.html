<form class="formulario-datos">
    <h3>Registro</h3>

    <div class="fila-formulario">
        <input type="text" placeholder="¿Cuál es su primer nombre?">
        <input type="text" placeholder="¿Cuál es su segundo nombre?">
        <input type="text" placeholder="¿Cuál es su primer apellido?">
        <input type="text" placeholder="¿Cuál es su segundo apellido?">
    </div>

    <hr class="form-divider">

    <div class="fila-formulario">
        <input type="date" value="2025-12-03">
        <select>
            <option value="" disabled selected hidden>¿Cuál es su género?</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
        </select>
    </div>

    <hr class="form-divider">

    <div class="fila-formulario">
        <select>
            <option value="" disabled selected hidden>¿Cuál es su tipo de documento?</option>
            <option value="cc">Cédula de ciudadanía</option>
            <option value="ti">Tarjeta de identidad</option>
            <option value="ce">Cédula de extranjería</option>
            <option value="pasaporte">Pasaporte</option>
        </select>
        <input type="text" placeholder="Número de documento">
    </div>

    <hr class="form-divider">

    <div class="fila-formulario">
        <input type="text" placeholder="¿Cuál es su correo electrónico?">
        <input type="text" placeholder="¿Cuál es su número telefónico">
    </div>

    <div class="fila-formulario" style="display: flex; justify-content: center;">
        <input type="text" style="width: 350px;" placeholder="Ingrese una contraseña">
        <input type="text" style="width: 350px;" placeholder="Confirme su contraseña">
    </div>

    <hr class="form-divider">

    <div style="display: flex; justify-content: center;">
        <button class="boton-formulario" style="width: 250px">Registrarse</button>
    </div>
</form>
