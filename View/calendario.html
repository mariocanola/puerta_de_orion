<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/calendario.css">
  <link rel="stylesheet" href="../css/main.css">


</head>

<body data-rol="Entrenador">
  <br>
  <!-- Main Content -->
  <main class="p-12">
    <h1 class="text-5xl font-bold text-center mb-12 text-gray-800">
      Calendario
    </h1>

    <!-- Calendar Container -->
    <div
      class="calendar-container bg-white rounded-3xl shadow-2xl p-12 border-4 border-blue-700 flex flex-col items-center">
      <!-- Calendar Header -->
      <div class="calendar-header flex justify-between items-center rounded-xl bg-yellow-400 px-8 py-4 w-full mb-6">
        <button class="text-blue-700 hover:text-blue-900 transition-colors bg-transparent" id="prev-month">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <span class="text-blue-900 font-bold text-2xl text-center w-full" id="calendar-title">March 2025</span>
        <button class="text-blue-700 hover:text-blue-900 transition-colors bg-transparent" id="next-month">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>

      <!-- Calendar Grid: nombres de los días -->
      <div class="calendar-grid w-full">
        <div class="font-bold text-gray-700 text-xl text-center">Lu</div>
        <div class="font-bold text-gray-700 text-xl text-center">Ma</div>
        <div class="font-bold text-gray-700 text-xl text-center">Mi</div>
        <div class="font-bold text-gray-700 text-xl text-center">Ju</div>
        <div class="font-bold text-gray-700 text-xl text-center">Vi</div>
        <div class="font-bold text-gray-700 text-xl text-center">Sa</div>
        <div class="font-bold text-gray-700 text-xl text-center">Do</div>
      </div>
      <!-- Grid de días del mes -->
      <div id="calendar-days" class="grid grid-cols-7 gap-2 mt-4 w-full"></div>

      <!-- Panel de ubicación -->
      <div id="location-panel" class="mt-8 w-full">
        <div class="bg-blue-50 rounded-xl p-6 border-2 border-blue-200">
          <h3 class="text-2xl font-bold text-blue-800 mb-4">Información del Entrenamiento</h3>
          <div class="space-y-4">
            <div>
              <span class="font-semibold text-blue-700">Fecha seleccionada:</span>
              <span id="selected-date" class="ml-2 text-blue-900"></span>
            </div>
            
            <!-- Panel de visualización de información -->
            <div id="location-info">
              <div>
                <span class="font-semibold text-blue-700">Ubicación:</span>
                <span id="training-location" class="ml-2 text-blue-900">Seleccione una fecha</span>
              </div>
              <div class="text-blue-800 mt-2">
                <p id="location-address" class="mb-2"></p>
                <p id="training-time" class="font-medium mb-2"></p>
                <p id="training-description" class="mb-4"></p>
              </div>
              <!-- Botón para modificar entrenamiento -->
              <div id="update-button-container" class="pt-2 border-t border-gray-200 mt-4 hidden">
                <button id="update-training"
                        class="w-full px-4 py-2 text-sm font-medium text-white bg-yellow-500 rounded-md hover:bg-yellow-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500">
                  Modificar Entrenamiento
                </button>
              </div>
            </div>
            
            <!-- Formulario para programar entrenamiento (solo para administradores) -->
            <div id="schedule-form" class="hidden">
              <h4 class="text-lg font-semibold text-blue-800 mb-3">Programar Entrenamiento</h4>
              <form id="training-form" class="space-y-3 text-sm">
                <!-- Selección de lugar -->
                <div class="space-y-1">
                  <label for="location-select" class="block text-xs font-medium text-gray-700">Lugar de Entrenamiento</label>
                  <select id="location-select" required
                          class="block w-full text-sm rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-1 h-9">
                    <option value="">Seleccione un lugar</option>
                    <option value="Sede Principal - SENA">Sede Principal - SENA</option>
                    <option value="Cancha Alterna - Parque El Salitre">Cancha Alterna - Parque El Salitre</option>
                    <option value="Estadio Metropolitano">Estadio Metropolitano</option>
                    <option value="Polideportivo El Tunal">Polideportivo El Tunal</option>
                    <option value="Unidad Deportiva El Salitre">Unidad Deportiva El Salitre</option>
                    <option value="Otro">Otro (especificar)</option>
                  </select>
                  <input type="text" id="location-other" class="mt-1 hidden w-full text-sm rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-1 h-9" 
                         placeholder="Especifique el lugar">
                </div>
                
                <!-- Dirección -->
                <div class="space-y-1">
                  <label for="location-address-input" class="block text-xs font-medium text-gray-700">Dirección</label>
                  <input type="text" id="location-address-input" required
                         class="block w-full text-sm rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-1 h-9">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                  <!-- Selección de hora de inicio -->
                  <div class="space-y-1">
                    <label for="start-time" class="block text-xs font-medium text-gray-700">Hora Inicio</label>
                    <select id="start-time" required
                            class="block w-full text-sm rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-1 h-9">
                      <option value="">Seleccionar</option>
                      <script>
                        document.write(Array.from({length: 16}, (_, i) => {
                          const hour = i + 6; // Empieza a las 6 AM
                          const hour12 = hour % 12 || 12;
                          const ampm = hour < 12 ? 'AM' : 'PM';
                          return `<option value="${String(hour).padStart(2, '0')}:00">${hour12}:00 ${ampm}</option>`;
                        }).join(''));
                      </script>
                    </select>
                  </div>
                  
                  <!-- Selección de hora de fin -->
                  <div class="space-y-1">
                    <label for="end-time" class="block text-xs font-medium text-gray-700">Hora Fin</label>
                    <select id="end-time" required
                            class="block w-full text-sm rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-1 h-9">
                      <option value="">Seleccionar</option>
                      <script>
                        document.write(Array.from({length: 16}, (_, i) => {
                          const hour = i + 7; // Empieza a las 7 AM
                          const hour12 = hour % 12 || 12;
                          const ampm = hour < 12 ? 'AM' : 'PM';
                          return `<option value="${String(hour).padStart(2, '0')}:00">${hour12}:00 ${ampm}</option>`;
                        }).join(''));
                      </script>
                    </select>
                  </div>
                </div>
                
                <!-- Tipo de entrenamiento -->
                <div class="space-y-1">
                  <label class="block text-xs font-medium text-gray-700 mb-1">Tipo de Entrenamiento</label>
                  <div class="space-y-1">
                    <div class="flex items-center">
                      <input id="training-physical" name="training-type" type="radio" value="Físico" required
                             class="h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-gray-300">
                      <label for="training-physical" class="ml-2 block text-xs text-gray-700">Físico</label>
                    </div>
                    <div class="flex items-center">
                      <input id="training-technical" name="training-type" type="radio" value="Técnico"
                             class="h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-gray-300">
                      <label for="training-technical" class="ml-2 block text-xs text-gray-700">Técnico</label>
                    </div>
                    <div class="flex items-center">
                      <input id="training-championship" name="training-type" type="radio" value="Campeonato"
                             class="h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-gray-300">
                      <label for="training-championship" class="ml-2 block text-xs text-gray-700">Campeonato</label>
                    </div>
                    <div class="flex items-center">
                      <input id="training-other" name="training-type" type="radio" value="Otro"
                             class="h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-gray-300">
                      <label for="training-other" class="ml-2 block text-xs text-gray-700">Otro</label>
                    </div>
                    <input type="text" id="training-other-text" 
                           class="mt-1 ml-5 hidden w-full text-xs rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 py-1 h-8" 
                           placeholder="Especifique el tipo">
                  </div>
                </div>
                
                <div class="flex justify-end space-x-2 pt-1">
                  <button type="button" id="cancel-schedule" 
                          class="px-3 py-1.5 text-xs font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    Cancelar
                  </button>
                  <button type="submit" 
                          class="px-3 py-1.5 text-xs font-medium text-white bg-blue-600 border border-transparent rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    Guardar
                  </button>
                </div>
              </form>
            </div>
            
            <!-- Botón para programar nuevo entrenamiento (solo para administradores) -->
            <div id="schedule-button-container" class="pt-2 border-t border-gray-200 mt-4 hidden">
              <button id="schedule-training" 
                      class="w-full px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                Programar Entrenamiento
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Google Maps API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&callback=initMap" async defer></script>
  
  <!-- Scripts -->
  <script src="../JS/calendario.js"></script>
  <script defer src="../js/encabezado.js"></script>

</body>

</html>
