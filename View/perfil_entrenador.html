<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puerta de Orión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/perfiles.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/menu.css" />
</head>

<body>
    <!-- Encabezado -->
    <header class="encabezado">
        <i class="fas fa-bars menu-toggle"></i>
        <img src="../imgs/logo.png" alt="text">

    </header>
    <div class="menu-categorias" id="menu"">
        <ul>
        <li><a href=" #">Planilla</a></li>
        <hr class="form-divider">
        <li><a href=" #">Inicio</a></li>
        </ul>
    </div>

    <!-- Fin de encabezado -->

    <main class="contenido-principal">

        <!-- Tarjeta de perfil -->
        <div class="tarjeta-perfil">
            <div class="imagen-usuario">
                <img src="../imgs/image.png" alt="usuario">
            </div>
            <div class="contenido-perfil">
                <h2>Entrenador</h2>
                <button class="boton-perfil">Roles</button>
            </div>
        </div>

        <!-- Fin tarjeta de perfil -->

        <!-- Formulario -->
        <form class="formulario-datos">
            <h3>Perfil</h3>

            <div class="fila-formulario">
                <input type="text" placeholder="Primer Nombre">
                <input type="text" placeholder="Segundo Nombre">
                <input type="text" placeholder="Primer Apellido">
                <input type="text" placeholder="Segundo Apellido">
            </div>

            <hr class="form-divider">

            <div class="fila-formulario">
                <input type="date" value="2025-12-03">
                <select>
                    <option value="" disabled selected hidden>Género</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <hr class="form-divider">

            <div class="fila-formulario">
                <select>
                    <option value="" disabled selected hidden>Tipo de documento</option>
                    <option value="cc">Cédula de ciudadanía</option>
                    <option value="ti">Tarjeta de identidad</option>
                    <option value="ce">Cédula de extranjería</option>
                    <option value="pasaporte">Pasaporte</option>
                </select>
                <input type="text" placeholder="Número de documento">
            </div>

            <hr class="form-divider">

            <div class="fila-formulario">
                <input type="text" placeholder="Correo electrónico">
                <input type="text" placeholder="Número telefónico">
            </div>

            <div class="fila-formulario" style="display: flex; justify-content: center;">
                <input type="text" style="width: 350px;" placeholder="Contraseña">
            </div>

            <hr class="form-divider">

            <div style="display: flex; justify-content: center;">
                <button class="boton-perfil" style="width: 250px">Editar</button>
            </div>
        </form>
        <!-- Fin formulario -->

    </main>


    <!-- Script para interactividad con boton de menú-->
    <script>
        const toggle = document.querySelector('.menu-toggle');
        const menu = document.querySelector('.menu-categorias');

        toggle.addEventListener('click', () => {
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        });
    </script>

</body>

</html>
