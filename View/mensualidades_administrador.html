<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Mensualidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/mensualidades.css">
</head>

<body class="bg-gray-100">

    <header class="bg-blue-900 text-white flex justify-between items-center px-6 py-4">
        <div class="flex items-center gap-3">
            <button class="bg-yellow-400 text-black font-bold px-4 py-1 rounded">Categoría 2</button>
            <div class="w-1.5 h-6 bg-yellow-400"></div>
            <button class="bg-yellow-400 text-black font-bold px-4 py-1 rounded">Categoría 2</button>
            <div class="w-1.5 h-6 bg-yellow-400"></div>
        </div>

        <div class="flex items-center gap-2">
            <img src="../imgs/logo.png" alt="Logo" class="h-8">
        </div>

        <div class="flex items-center gap-2">
            <div class="w-1.5 h-6 bg-yellow-400"></div>
            <img src="../imgs/user.png" alt="Usuario" class="h-8 w-8 rounded-full">
        </div>
    </header>

    <main class="p-8 flex justify-center">
        <div class="w-full max-w-6xl bg-blue-900 p-6 rounded-2xl shadow-lg">

            <div class="flex items-center justify-between mb-6">
                <input type="text" placeholder="espacio"
                    class="w-1/4 px-4 py-2 text-black bg-yellow-400 rounded-md border border-gray-300 focus:outline-none text-sm shadow-sm">
                <h1 class="text-3xl font-bold text-white text-center flex-grow">Mensualidades</h1>
            </div>

            <div class="bg-yellow-400 p-6 rounded-xl">
                <div class="flex flex-wrap gap-6 justify-between">

                    <div class="bg-white p-6 rounded-xl shadow-lg border border-blue-800 w-full md:w-[40%]">
                        <h2 class="text-blue-800 font-bold text-xl mb-4">Filtrar Deportistas</h2>
                        <input type="text" placeholder="Nombre del deportista"
                            class="w-full mb-4 px-4 py-2 border border-gray-300 rounded-md focus:outline-none">
                        <textarea placeholder="Comentarios..." rows="5"
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none"></textarea>
                    </div>

                    <div class="bg-blue-900 p-6 rounded-xl w-full md:w-[55%]">
                        <div class="bg-white p-6 rounded-xl shadow-lg border border-blue-800 relative">
                            <h2 class="text-blue-800 font-bold text-xl mb-4">Historial de Pagos</h2>
                            <table class="w-full border-collapse text-center">
                                <thead class="bg-blue-800 text-white">
                                    <tr>
                                        <th class="py-2">Nombre</th>
                                        <th>Mes</th>
                                        <th>Valor</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-mensualidades">
                                    <tr class="cursor-pointer hover:bg-gray-100"
                                        onclick="mostrarPopup(event, 'Juan Pérez', 'Julio', '$80.000', 'Pagado')">
                                        <td>Nombre</td>
                                        <td>Mes</td>
                                        <td>$Valor</td>
                                        <td class="text-green-600 font-bold">Pagado</td>
                                    </tr>
                                    <tr class="cursor-pointer hover:bg-gray-100"
                                        onclick="mostrarPopup(event, 'Ana Gómez', 'Julio', '$80.000', 'Pendiente')">
                                        <td>Nombre</td>
                                        <td>Mes</td>
                                        <td>$Valor</td>
                                        <td class="text-red-600 font-bold">Pendiente</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
                
    </main>
