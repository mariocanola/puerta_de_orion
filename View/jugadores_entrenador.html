<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jugadores</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white min-h-screen">

    <header class="bg-blue-900 text-white flex justify-between items-center px-6 py-4">
        <div class="flex items-center gap-4">
            <button class="bg-yellow-400 text-black font-bold px-4 py-1 rounded-full">Categoría 2</button>
            <div class="w-1.5 h-6 bg-yellow-400"></div>
        </div>
        <img src="../imgs/logo.png" alt="Logo" class="h-8">
        <div class="flex items-center gap-4">
            <div class="w-1.5 h-6 bg-yellow-400"></div>
            <img src="../imgs/user.png" alt="Usuario" class="h-8 w-8 rounded-full">
        </div>
    </header>

    <main class="p-6 flex justify-center">
        <div class="w-full max-w-7xl bg-blue-900 p-4 rounded-lg">
            <div class="flex justify-between items-center mb-4">
                <input type="text" placeholder="Type here..."
                    class="bg-yellow-400 text-black px-4 py-2 rounded w-2/5" />
                <div class="flex items-center gap-2">
                    <input type="text" placeholder="Search..."
                        class="bg-yellow-400 px-4 py-2 rounded-full bg-white text-black" />
                </div>
            </div>

            <div class="bg-yellow-400 p-4 rounded-md">

                <div class="flex gap-4 flex-wrap">

                    <div class="bg-white w-full md:w-[40%] p-4 rounded shadow">
                        <input type="text" class="w-full px-3 py-2 border mb-4" placeholder="Placeholder" />
                        <p class="text-gray-700 text-sm leading-relaxed">
                            Descripción
                        </p>
                    </div>

                    <div class="bg-blue-900 w-full md:w-[58%] p-4 rounded shadow">
                        <div class="bg-white p-4 rounded shadow overflow-x-auto">
                            <table class="table-auto w-full text-center border-collapse">
                                <thead class="bg-blue-800 text-white">
                                    <tr>
                                        <th class="px-2 py-1">Columna 1</th>
                                        <th class="px-2 py-1">Columna 2</th>
                                        <th class="px-2 py-1">Columna 3</th>
                                        <th class="px-2 py-1">Columna 4</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="border-t">
                                        <td class="py-2">Dato 1</td>
                                        <td>Dato 2</td>
                                        <td>Dato 3</td>
                                        <td>Dato 4</td>
                                    </tr>
                                    <tr class="border-t">
                                        <td class="py-2">Dato 5</td>
                                        <td>Dato 6</td>
                                        <td>Dato 7</td>
                                        <td>Dato 8</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </main>

</body>

</html>
